name: Đưa web tĩnh lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  trien-khai:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.trien-khai.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gom đúng tệp của ứng dụng
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: trien-khai
        uses: actions/deploy-pages@v4
